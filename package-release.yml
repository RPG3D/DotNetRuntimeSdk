name: Package DotNetRuntimeSDK Release

# Assembles a GitHub Release from a build-all run's artifacts as TWO zips
# (download on demand, one per backend — mirrors the repository layout):
#   MonoSDK-<version>-Release.zip     Mono/{Win64,Mac,Linux,Android,IOS,IOSSimulator}/...
#   CoreClrSDK-<version>-Release.zip  CoreCLR/{Android,IOS,IOSSimulator}/...
# Extract either zip over this SDK directory. The release notes record the exact
# dotnet/runtime pins from DotNetRuntime.version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      run_id:
        description: 'build-all run id to package (empty = latest successful)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - name: Checkout DotNetRuntimeSDK
        uses: actions/checkout@v4

      - name: Resolve run id
        id: run
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" -w build-all.yml -s success -L 1 --json databaseId --jq '.[0].databaseId')"
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download all build artifacts
        run: |
          gh run download "${{ steps.run.outputs.id }}" -R "$GITHUB_REPOSITORY" -D artifacts
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble backend trees
        run: |
          set -euo pipefail
          mkdir -p package/Mono package/CoreCLR
          # bash 3.2 safe: case mapping, no associative arrays.
          for ART in artifacts/*/; do
            NAME="$(basename "$ART")"
            case "$NAME" in
              MonoSDK-Linux-x64-*)              DEST="Mono/Linux/x64" ;;
              MonoSDK-Windows-x64-*)            DEST="Mono/Win64/x64" ;;
              MonoSDK-macOS-x64-*)              DEST="Mono/Mac/x64" ;;
              MonoSDK-macOS-arm64-*)            DEST="Mono/Mac/arm64" ;;
              MonoSDK-Android-arm64-*)          DEST="Mono/Android/arm64" ;;
              MonoSDK-iOS-arm64-*)              DEST="Mono/IOS/arm64" ;;
              MonoSDK-iOS-Simulator-arm64-*)    DEST="Mono/IOSSimulator/arm64" ;;
              CoreClrSDK-Android-arm64-*)       DEST="CoreCLR/Android/arm64" ;;
              CoreClrSDK-iOS-arm64-*)           DEST="CoreCLR/IOS/arm64" ;;
              CoreClrSDK-iOS-Simulator-arm64-*) DEST="CoreCLR/IOSSimulator/arm64" ;;
              *) echo "Unknown artifact: $NAME" >&2; exit 1 ;;
            esac
            mkdir -p "package/$DEST"
            cp -R "$ART." "package/$DEST/"
            echo "  $NAME -> $DEST"
          done

      - name: Zip per backend
        run: |
          set -euo pipefail
          cd package
          zip -X -y -q -r "MonoSDK-${{ github.event.inputs.version }}-Release.zip" Mono
          zip -X -y -q -r "CoreClrSDK-${{ github.event.inputs.version }}-Release.zip" CoreCLR
          ls -la *.zip

      - name: Read pins for release notes
        id: pins
        run: |
          echo "mono=$(grep -E '^MONO_SOURCE_TAG=' DotNetRuntime.version | cut -d= -f2- | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "clr=$(grep -E '^SOURCE_TAG=' DotNetRuntime.version | cut -d= -f2- | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## Contents
            - `MonoSDK-*-Release.zip` — Mono payloads (Win64, Mac x64/arm64, Linux, Android, iOS, iOS Simulator) + shared include/
            - `CoreClrSDK-*-Release.zip` — CoreCLR payloads (Android, iOS, iOS Simulator) + host headers in each payload's include/

            ## Build Info
            Mono source: https://github.com/dotnet/runtime.git (${{ steps.pins.outputs.mono }})
            CoreCLR source: https://github.com/dotnet/runtime.git (${{ steps.pins.outputs.clr }})
            Build date: ${{ github.event.inputs.version }}
          files: |
            package/MonoSDK-${{ github.event.inputs.version }}-Release.zip
            package/CoreClrSDK-${{ github.event.inputs.version }}-Release.zip
          draft: false
          prerelease: false
