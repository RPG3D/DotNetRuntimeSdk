name: Package DotNetRuntimeSDK Release

# Assembles a GitHub Release from ONE build-all run's artifacts as TWO zips
# (download on demand, one per backend):
#   MonoSDK-<version>-Release.zip     Mono/{Win64,Mac,Linux,Android,IOS,IOSSimulator}/...
#   CoreClrSDK-<version>-Release.zip  CoreCLR/{Android,IOS,IOSSimulator}/...
#
# Artifact selection is strictly BY NAME and BY build type — never "latest of
# everything": every one of the 10 expected artifact names must exist in the chosen
# run with the requested build-type suffix, otherwise packaging FAILS. This keeps
# semantically different builds (Debug vs Release, old pins vs new pins) from ever
# being mixed into one SDK version. The release notes carry the run id, the workflow
# commit and the dotnet/runtime pins for provenance.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      build_type:
        description: 'Build type of the artifacts to package'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      run_id:
        description: 'build-all run id (empty = latest successful build-all run)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  # backend -> artifact base names (exact; build-type suffix appended at download).
  EXPECTED_MONO: "MonoSDK-Linux-x64 MonoSDK-Windows-x64 MonoSDK-macOS-x64 MonoSDK-macOS-arm64 MonoSDK-Android-arm64 MonoSDK-iOS-arm64 MonoSDK-iOS-Simulator-arm64"
  EXPECTED_CLR: "CoreClrSDK-Android-arm64 CoreClrSDK-iOS-arm64 CoreClrSDK-iOS-Simulator-arm64"

jobs:
  package:
    runs-on: macos-26
    steps:
      - name: Checkout DotNetRuntimeSDK
        uses: actions/checkout@v4

      - name: Resolve run id
        id: run
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" -w build-all.yml -s success -L 1 --json databaseId --jq '.[0].databaseId')"
          fi
          HEAD_SHA="$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download expected artifacts by exact name
        run: |
          set -euo pipefail
          BT="${{ github.event.inputs.build_type }}"
          MISSING=""
          for BASE in $EXPECTED_MONO $EXPECTED_CLR; do
            NAME="${BASE}-${BT}"
            if ! gh run download "${{ steps.run.outputs.id }}" -R "$GITHUB_REPOSITORY" \
                 -n "$NAME" -D "artifacts/$NAME"; then
              MISSING="$MISSING $NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: run ${{ steps.run.outputs.id }} is missing artifacts:$MISSING" >&2
            echo "Re-run those build-all legs (same run) or pick a complete run." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble backend trees
        run: |
          set -euo pipefail
          BT="${{ github.event.inputs.build_type }}"
          mkdir -p package/Mono package/CoreCLR
          # bash 3.2 safe: flat case from EXACT artifact names (build-type suffix
          # verified, no wildcards) -> destination inside the backend layer.
          for ART in artifacts/*/; do
            NAME="$(basename "$ART")"
            case "$NAME" in
              MonoSDK-Linux-x64-$BT)                DEST="Mono/Linux/x64" ;;
              MonoSDK-Windows-x64-$BT)              DEST="Mono/Win64/x64" ;;
              MonoSDK-macOS-x64-$BT)                DEST="Mono/Mac/x64" ;;
              MonoSDK-macOS-arm64-$BT)              DEST="Mono/Mac/arm64" ;;
              MonoSDK-Android-arm64-$BT)            DEST="Mono/Android/arm64" ;;
              MonoSDK-iOS-arm64-$BT)                DEST="Mono/IOS/arm64" ;;
              MonoSDK-iOS-Simulator-arm64-$BT)      DEST="Mono/IOSSimulator/arm64" ;;
              CoreClrSDK-Android-arm64-$BT)         DEST="CoreCLR/Android/arm64" ;;
              CoreClrSDK-iOS-arm64-$BT)             DEST="CoreCLR/IOS/arm64" ;;
              CoreClrSDK-iOS-Simulator-arm64-$BT)   DEST="CoreCLR/IOSSimulator/arm64" ;;
              *) echo "ERROR: unexpected artifact '$NAME' (expected -$BT names) - refusing to package" >&2; exit 1 ;;
            esac
            mkdir -p "package/$DEST"
            cp -R "$ART." "package/$DEST/"
            echo "  $NAME -> $DEST"
          done

      - name: Zip per backend
        run: |
          set -euo pipefail
          cd package
          zip -X -y -q -r "MonoSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip" Mono
          zip -X -y -q -r "CoreClrSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip" CoreCLR
          ls -la *.zip

      - name: Read pins for release notes
        id: pins
        run: |
          echo "mono=$(grep -E '^MONO_SOURCE_TAG=' DotNetRuntime.version | cut -d= -f2- | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "clr=$(grep -E '^SOURCE_TAG=' DotNetRuntime.version | cut -d= -f2- | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## Contents
            - `MonoSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip` — Mono payloads (Win64, Mac x64/arm64, Linux, Android, iOS, iOS Simulator) + shared include/
            - `CoreClrSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip` — CoreCLR payloads (Android, iOS, iOS Simulator) + host headers in each payload's include/

            ## Build Info
            Build type: ${{ github.event.inputs.build_type }}
            build-all run: [${{ steps.run.outputs.id }}](https://github.com/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }}) (commit ${{ steps.run.outputs.sha }})
            Mono source: https://github.com/dotnet/runtime.git (${{ steps.pins.outputs.mono }})
            CoreCLR source: https://github.com/dotnet/runtime.git (${{ steps.pins.outputs.clr }})
          files: |
            package/MonoSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip
            package/CoreClrSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip
          draft: false
          prerelease: false
