name: Package DotNetRuntimeSDK Release

# Assembles a GitHub Release from ONE build-all run's artifacts as TWO zips
# (download on demand, one per backend):
#   MonoSDK-<version>-<build_type>.zip     Mono/{Win64,Mac,Linux,Android,IOS,IOSSimulator}/...
#   CoreClrSDK-<version>-<build_type>.zip  CoreCLR/{Android,IOS,IOSSimulator}/...
#
# Artifact selection is strict on THREE axes, so payloads from different dotnet/runtime
# commits can never be mixed into one SDK version:
#   1. run id       - one build-all run (one workflow commit, one DotNetRuntime.version)
#   2. exact name   - artifact names embed the runtime pin (MonoSDK-<MONO_SOURCE_TAG>-...,
#                     CoreClrSDK-<SOURCE_TAG>-...) resolved from THIS checkout of
#                     DotNetRuntime.version; a stale-pin artifact fails the download
#   3. build type   - exact -Release/-Debug suffix, never mixed
# The release notes carry the run id, workflow commit and both runtime pins.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      build_type:
        description: 'Build type of the artifacts to package'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      run_id:
        description: 'build-all run id (empty = latest successful build-all run)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - name: Checkout DotNetRuntimeSDK
        uses: actions/checkout@v4

      - name: Read pins from DotNetRuntime.version
        id: pins
        run: |
          echo "mono=$(grep -E '^MONO_SOURCE_TAG=' DotNetRuntime.version | cut -d= -f2- | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "clr=$(grep -E '^SOURCE_TAG=' DotNetRuntime.version | cut -d= -f2- | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Resolve run id
        id: run
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" -w build-all.yml -s success -L 1 --json databaseId --jq '.[0].databaseId')"
          fi
          HEAD_SHA="$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download expected artifacts by pinned exact name
        run: |
          set -euo pipefail
          BT="${{ github.event.inputs.build_type }}"
          MONO="${{ steps.pins.outputs.mono }}"
          CLR="${{ steps.pins.outputs.clr }}"
          MISSING=""
          for NAME in \
            "MonoSDK-${MONO}-Linux-x64-${BT}" \
            "MonoSDK-${MONO}-Windows-x64-${BT}" \
            "MonoSDK-${MONO}-macOS-x64-${BT}" \
            "MonoSDK-${MONO}-macOS-arm64-${BT}" \
            "MonoSDK-${MONO}-Android-arm64-${BT}" \
            "MonoSDK-${MONO}-iOS-arm64-${BT}" \
            "MonoSDK-${MONO}-iOS-Simulator-arm64-${BT}" \
            "CoreClrSDK-${CLR}-Android-arm64-${BT}" \
            "CoreClrSDK-${CLR}-iOS-arm64-${BT}" \
            "CoreClrSDK-${CLR}-iOS-Simulator-arm64-${BT}"; do
            if ! gh run download "${{ steps.run.outputs.id }}" -R "$GITHUB_REPOSITORY" \
                 -n "$NAME" -D "artifacts/$NAME"; then
              MISSING="$MISSING $NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: run ${{ steps.run.outputs.id }} is missing (or has stale-pin) artifacts:$MISSING" >&2
            echo "The artifact name embeds the runtime pin from DotNetRuntime.version; a" >&2
            echo "mismatch means the run was built from a different pin - rebuild or pick another run." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble backend trees
        run: |
          set -euo pipefail
          BT="${{ github.event.inputs.build_type }}"
          MONO="${{ steps.pins.outputs.mono }}"
          CLR="${{ steps.pins.outputs.clr }}"
          mkdir -p package/Mono package/CoreCLR
          # bash 3.2 safe: flat case on EXACT pinned names -> destination.
          for ART in artifacts/*/; do
            NAME="$(basename "$ART")"
            case "$NAME" in
              "MonoSDK-${MONO}-Linux-x64-${BT}")              DEST="Mono/Linux/x64" ;;
              "MonoSDK-${MONO}-Windows-x64-${BT}")            DEST="Mono/Win64/x64" ;;
              "MonoSDK-${MONO}-macOS-x64-${BT}")              DEST="Mono/Mac/x64" ;;
              "MonoSDK-${MONO}-macOS-arm64-${BT}")            DEST="Mono/Mac/arm64" ;;
              "MonoSDK-${MONO}-Android-arm64-${BT}")          DEST="Mono/Android/arm64" ;;
              "MonoSDK-${MONO}-iOS-arm64-${BT}")              DEST="Mono/IOS/arm64" ;;
              "MonoSDK-${MONO}-iOS-Simulator-arm64-${BT}")    DEST="Mono/IOSSimulator/arm64" ;;
              "CoreClrSDK-${CLR}-Android-arm64-${BT}")        DEST="CoreCLR/Android/arm64" ;;
              "CoreClrSDK-${CLR}-iOS-arm64-${BT}")            DEST="CoreCLR/IOS/arm64" ;;
              "CoreClrSDK-${CLR}-iOS-Simulator-arm64-${BT}")  DEST="CoreCLR/IOSSimulator/arm64" ;;
              *) echo "ERROR: unexpected artifact '$NAME' - refusing to package" >&2; exit 1 ;;
            esac
            mkdir -p "package/$DEST"
            cp -R "$ART." "package/$DEST/"
            echo "  $NAME -> $DEST"
          done

      - name: Zip per backend
        run: |
          set -euo pipefail
          cd package
          zip -X -y -q -r "MonoSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip" Mono
          zip -X -y -q -r "CoreClrSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip" CoreCLR
          shasum -a 256 *.zip > SHA256SUMS.txt
          ls -la *.zip SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## Contents
            - `MonoSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip` — Mono payloads (Win64, Mac x64/arm64, Linux, Android, iOS, iOS Simulator) + shared include/
            - `CoreClrSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip` — CoreCLR payloads (Android, iOS, iOS Simulator) + host headers in each payload's include/

            ## Build Info
            Build type: ${{ github.event.inputs.build_type }}
            build-all run: [${{ steps.run.outputs.id }}](https://github.com/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }}) (commit ${{ steps.run.outputs.sha }})
            Mono source: https://github.com/dotnet/runtime.git (${{ steps.pins.outputs.mono }})
            CoreCLR source: https://github.com/dotnet/runtime.git (${{ steps.pins.outputs.clr }})
          files: |
            package/MonoSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip
            package/CoreClrSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type }}.zip
            package/SHA256SUMS.txt
          draft: false
          prerelease: false
